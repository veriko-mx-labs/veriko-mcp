name: Bug report
description: Reporta algo que no funciona como dice la documentación.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        No pegues claves de API, comprobantes, números de cuenta ni datos de clientes. Reemplázalos por valores de ejemplo.
        Si es una vulnerabilidad de seguridad, sigue la [política de seguridad](https://github.com/veriko-mx-labs/veriko-mcp/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: Qué sucede
      description: 'Describe lo que observas.'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducirlo
      description: 'Da la secuencia más corta que lo reproduce.'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperas
      description: 'Describe el comportamiento que te hace esperar la documentación o el spec.'
    validations:
      required: true
  - type: input
    id: v0
    attributes:
      label: 'Versión de `@veriko-mx/mcp`'
      placeholder: '0.2.3'
    validations:
      required: true
  - type: input
    id: v1
    attributes:
      label: 'Versión de Node.js'
    validations:
      required: true
  - type: dropdown
    id: v2
    attributes:
      label: 'Transporte'
      options:
        - 'stdio'
        - 'HTTP'
    validations:
      required: true
  - type: input
    id: v3
    attributes:
      label: 'Cliente MCP y versión'
      placeholder: 'el nombre y la versión de tu editor o asistente'
    validations:
      required: true
  - type: input
    id: v4
    attributes:
      label: '`VERIKO_MCP_PROFILE` y `VERIKO_MCP_MAX_RISK`'
      description: 'Los valores que fijaste, si hay.'
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: 'request_id'
      description: 'El `request_id` de la respuesta de error, cuando la API respondió con un error (el campo `request_id` del resultado de la herramienta).'
  - type: textarea
    id: output
    attributes:
      label: Salida o registros
      description: 'Pega el error o el cuerpo de la respuesta. Quita antes los secretos.'
  - type: checkboxes
    id: confirmation
    attributes:
      label: Antes de enviar
      options:
        - label: Busqué entre los issues abiertos.
          required: true
        - label: Quité las claves de API y los datos personales de este reporte.
          required: true
