name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify the tag and that publishing is enabled
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          private="$(node -p "require('./package.json').private === true")"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$private" = "false"
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-list -n 1 "$GITHUB_REF_NAME")" origin/main
      - run: npm ci
      - run: npm run check
      - run: npm run check:surface
      - name: Pack
        run: mkdir package && npm pack --pack-destination package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@veriko-mx/mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package/
      - name: Publish with retries on transient errors
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          public_npmrc="$(mktemp)"
          publish_log="$(mktemp)"
          trap 'rm -f "$public_npmrc" "$publish_log"' EXIT

          if npm view "@veriko-mx/mcp@$version" version --userconfig "$public_npmrc" >/dev/null 2>&1; then
            echo "@veriko-mx/mcp@$version is already public."
            exit 0
          fi

          for attempt in 1 2 3 4; do
            if npm publish ./package/*.tgz --access public >"$publish_log" 2>&1; then
              cat "$publish_log"
              break
            else
              status=$?
              cat "$publish_log" >&2
            fi

            if ! grep -Eiq 'E(429|500|502|503|504)|ECONNRESET|ETIMEDOUT|EAI_AGAIN' "$publish_log"; then
              exit "$status"
            fi
            if [ "$attempt" -eq 4 ]; then exit "$status"; fi
            sleep $((15 * 2 ** (attempt - 1)))
          done

          # This check avoids trusting a publish that npm accepted but did not make
          # visible. A version signed with provenance can take a few minutes to
          # appear, and npm itself warns that it "may take a few minutes".
          attempts=24
          for attempt in $(seq 1 "$attempts"); do
            if npm view "@veriko-mx/mcp@$version" version --userconfig "$public_npmrc" >/dev/null 2>&1; then
              echo "@veriko-mx/mcp@$version is available in the public registry."
              exit 0
            fi
            echo "Waiting for npm public propagation ($attempt/$attempts)..."
            sleep 15
          done
          echo "@veriko-mx/mcp@$version did not appear in the public registry after $((attempts * 15))s." >&2
          echo "If the log says '+ @veriko-mx/mcp@$version', the publish worked and this is propagation: rerun the job." >&2
          exit 1

  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create an ephemeral veriko-labs token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.VERIKO_LABS_APP_ID }}
          private-key: ${{ secrets.VERIKO_LABS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes 'No API changes. Updates documentation and metadata.'
