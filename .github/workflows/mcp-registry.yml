name: Register in the MCP Registry

# Registra en registry.modelcontextprotocol.io la versión que ya está en npm.
#
# Se lanza a mano (workflow_dispatch): registrar es publicar, y no debe
# ocurrir si nadie lo pide. Se autentica con DNS: el espacio de nombres
# mx.veriko se demuestra con un registro TXT en veriko.mx, y el workflow firma
# con la llave privada correspondiente, que vive en el secret
# MCP_REGISTRY_PRIVATE_KEY del entorno `npm`. La llave nunca se imprime.
#
# Reutiliza el entorno `npm`, el mismo que protege la publicación del paquete.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registrar:
    name: Register
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Comprobar que server.json describe la versión publicada
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./server.json').version")" = "$version"
          test "$(node -p "require('./server.json').packages[0].version")" = "$version"
          test "$(npm view "@veriko-mx/mcp@$version" version)" = "$version"
          test "$(npm view "@veriko-mx/mcp@$version" mcpName)" = "$(node -p "require('./server.json').name")"

      - name: Instalar mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          # Versión y suma de verificación fijas: actualizar el binario es un cambio revisado.
          tag=v1.8.1
          archive=mcp-publisher_linux_amd64.tar.gz
          sha256=a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
          curl -fsSL -o "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/$tag/$archive"
          echo "$sha256  $archive" | sha256sum -c -
          tar xzf "$archive" mcp-publisher

      - name: Iniciar sesión en el registro con DNS
        shell: bash
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "El secret MCP_REGISTRY_PRIVATE_KEY del entorno npm está vacío o no existe." >&2
            exit 1
          fi
          ./mcp-publisher login dns --domain veriko.mx --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Validar y publicar
        run: |
          ./mcp-publisher validate
          ./mcp-publisher publish

      - name: Comprobar que el servidor aparece en el listado
        shell: bash
        run: |
          name="$(node -p "require('./server.json').name")"
          for attempt in $(seq 1 12); do
            if curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=$name" | grep -q "\"$name\""; then
              echo "$name está en el registro."
              exit 0
            fi
            sleep 10
          done
          echo "$name no apareció en el registro después de dos minutos." >&2
          exit 1
