name: Sync the public spec

# El MCP depende de dos fuentes que cambian por su cuenta:
#
#   · el contrato público, que trae el workflow reutilizable de la organización:
#     descarga la exportación del portal y la escribe en `spec/openapi.yaml`;
#   · el SDK que consume este servidor, fijado por versión e integridad, que el
#     workflow reutilizable no revisa.
#
# Cuando el contrato cambia, `sync:contract` fija el nuevo SHA-256 en
# `check:surface`, escribe un resumen del cambio operación por operación y
# regenera la tabla de costo por perfil del README. El PR queda como borrador,
# con revisión solicitada y sin fusión automática: el CI corre completo y se ve
# antes de que alguien lo revise y lo marque como listo.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: veriko-mx-labs/.github/.github/workflows/sync-public-spec.yml@39a6ff721b020af5a33fb370b62a829eaacbeab3
    with:
      regenerate_command: npm ci && npm run sync:contract
      auto_merge: false
      draft: true
      summary_file: /tmp/contract-summary.md
    secrets:
      app_id: ${{ secrets.VERIKO_LABS_APP_ID }}
      app_private_key: ${{ secrets.VERIKO_LABS_PRIVATE_KEY }}

  sdk:
    name: The consumed SDK is the latest published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:sdk
        env:
          # Sólo para no topar con el límite por IP de la API de GitHub.
          GITHUB_TOKEN: ${{ github.token }}
