name: Sincronizar el spec público

# El MCP depende de dos fuentes que cambian por su cuenta:
#
#   · el contrato público, que trae el reusable de la organización: descarga el
#     export del portal y lo escribe en `spec/openapi.yaml`;
#   · el SDK que este servidor consume, fijado por versión e integridad, que el
#     reusable no revisa.
#
# Cuando el contrato cambia, `sync:contract` fija el SHA-256 nuevo en
# `check:surface`, escribe un resumen del cambio operación por operación y
# regenera la tabla de costo por perfil del README. El PR queda como borrador,
# con un revisor pedido y sin auto-merge: el CI corre completo y queda visible
# antes de que alguien lo revise y lo marque como listo.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: veriko-mx-labs/.github/.github/workflows/sync-public-spec.yml@eaaa2dca88eec1abbb98d75c8638290a28e0bbbb
    with:
      regenerate_command: npm ci && npm run sync:contract
      auto_merge: false
      draft: true
      summary_file: /tmp/contract-summary.md
    secrets:
      app_id: ${{ secrets.VERIKO_LABS_APP_ID }}
      app_private_key: ${{ secrets.VERIKO_LABS_PRIVATE_KEY }}
      reviewers: ${{ secrets.VERIKO_LABS_DEFAULT_REVIEWER }}

  sdk:
    name: El SDK consumido es el último publicado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:sdk
        env:
          # Sólo para no chocar con el límite por IP de la API de GitHub.
          GITHUB_TOKEN: ${{ github.token }}
